# Plusieurs modules dans un dépôt. La matrice est la vôtre : vous seul savez combien de
# publications lancer en parallèle, dans quel environment, et dans quel ordre.
#
# Ce dépôt fournit les outils — `portaki ci modules` répond « lesquels », les actions construisent
# et publient celui qu'on leur désigne. Le code des modules ne tourne que dans `build`, sans droits.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `ci modules --changed-since` compare deux révisions : un clone superficiel n'en a
          # qu'une, et tout serait reconstruit à chaque run.
          fetch-depth: 0
      - uses: PortakiApp/portaki-release-action/install@v2
      - id: list
        run: portaki ci modules --changed-since "${{ github.event.before }}"

  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: PortakiApp/portaki-release-action/build@v2
        with:
          working-directory: modules/${{ matrix.module }}
          artifact: module-${{ matrix.module }}

  release:
    needs: [detect, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    # Un seul job de publication par module à la fois : deux qui poussent la même version se
    # disputeraient son tag OCI. `cancel-in-progress: false` : on met en file.
    concurrency:
      group: portaki-release-${{ matrix.module }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJson(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: PortakiApp/portaki-release-action@v2
        with:
          working-directory: modules/${{ matrix.module }}
          artifact: module-${{ matrix.module }}
