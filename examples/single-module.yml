# Un dépôt, un module. Le cas le plus simple : l'action fait tout.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  # Sans ce droit GitHub n'émet aucun jeton OIDC, et il n'y a rien à échanger contre un
  # credential de publication. C'est ce jeton qui remplace un secret longue durée.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Deux publications simultanées du même module écrasent tour à tour le même tag OCI, et le
    # catalogue finit par référencer un digest que le tag ne porte plus. On met en file plutôt
    # que d'interrompre : une publication en cours doit aboutir.
    concurrency:
      group: portaki-release
      cancel-in-progress: false
    # La liaison enregistrée au registre exige un environment sur le canal stable : c'est lui
    # qui porte les relecteurs obligatoires.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: PortakiApp/portaki-release-action@v1
