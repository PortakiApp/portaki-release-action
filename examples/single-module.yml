# Un dépôt, un module. Deux jobs : le code du module (`build.rs`, ses tests) ne tourne que dans
# celui qui n'a aucun droit de publication ; celui qui les a pousse l'artefact vérifié dans le
# dépôt OCI de Portaki, le signe et l'annonce, sans rien exécuter du module — ni cargo.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      # Tests et batterie de conformité, build, contrôle du manifeste, emballage — puis l'artefact.
      - uses: PortakiApp/portaki-release-action/build@v2

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sans ce droit GitHub n'émet aucun jeton OIDC : rien à échanger contre un droit de push,
      # aucune identité pour signer. C'est ce jeton qui remplace tout secret.
      id-token: write
    # Deux publications simultanées de la même version se disputeraient son tag OCI. On met en
    # file plutôt que d'interrompre : une publication en cours doit aboutir.
    concurrency:
      group: portaki-release
      cancel-in-progress: false
    # La liaison enregistrée au registre exige un environment sur le canal stable : c'est lui
    # qui porte les relecteurs obligatoires.
    environment: release
    steps:
      # Les sources sont lues (Cargo.lock, CHANGELOG, listing.json), jamais compilées.
      - uses: actions/checkout@v7
      - uses: PortakiApp/portaki-release-action@v2
