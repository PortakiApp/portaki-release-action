name: Portaki — build a module
description: Test, build, check and package one Portaki module, then upload what the release job pushes. No publishing right needed.
author: Syntax Labs

# Le premier des deux jobs : celui qui exécute le code du module (`build.rs`, ses tests, la
# batterie de conformité) — donc celui qui ne détient aucun droit de publication. Rien n'est
# poussé ni annoncé d'ici. Le job à droits, `PortakiApp/portaki-release-action@v2`, télécharge
# l'artefact et le publie sans rien exécuter du module.

branding:
  icon: box
  color: green

inputs:
  working-directory:
    description: The module to build — its crate root.
    default: "."
  channel:
    description: The channel it is headed for — `stable` refuses an SDK older than 8.0.0.
    default: stable
  cli-version:
    description: Portaki CLI to install, or `auto` to match the SDK this checkout resolves to.
    default: auto
  check:
    description: >-
      Run `portaki ci check` after the build — the gates below, then warnings about an outdated
      SDK or a manifest the shell has moved past.
    default: "true"
  gates:
    description: >-
      Fail on what would keep the version from hosts — release notes in every published language,
      permission reasons, entity columns, the SDK pin. `false` keeps only the warnings.
    default: "true"
  artifact:
    description: Name of the uploaded artifact — the release job downloads it by this name. One per module in a matrix.
    default: portaki-module

outputs:
  id:
    description: The module id that was built.
    value: ${{ steps.build.outputs.id }}
  version:
    description: The version that was built.
    value: ${{ steps.build.outputs.version }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED: ${{ inputs.cli-version }}
      run: bash "$GITHUB_ACTION_PATH/../install/resolve.sh"

    - id: prebuilt
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
      run: bash "$GITHUB_ACTION_PATH/../install/prebuilt.sh"

    # Ce job compile déjà le module : `cargo install` n'y ajoute aucun droit.
    - if: steps.prebuilt.outputs.installed != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
      run: cargo install portaki-cli --version "$VERSION" --locked --force

    - shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        if ! portaki ci build --help >/dev/null 2>&1; then
          echo "::error::portaki ${VERSION} has no \`ci build\`, which this action needs — raise the portaki-sdk this checkout resolves to, or pin a newer \`cli-version\`."
          exit 1
        fi

    # La porte de `ci build` est celle de `portaki check` : fmt et clippy en font partie. Ajoutés à
    # la toolchain que ce dossier résout (`rust-toolchain.toml` du module compris), ici seulement :
    # le job à droits n'exécute ni cargo ni rustup.
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: rustup component add rustfmt clippy

    # fmt, clippy, tests (batterie de conformité comprise), build --release, manifeste, i18n, emballage.
    - id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHANNEL: ${{ inputs.channel }}
      run: portaki ci build --channel "$CHANNEL"

    # Après le build : `ci check` lit le manifeste qu'il écrit dans target/portaki/.
    # Les contrôles font échouer le job — notes de version de chaque langue publiée,
    # justifications des permissions, colonnes des entités, SDK du lock : sans eux la version
    # reste en brouillon, ou casse chaque écriture en production, sans que rien ne rougisse.
    # Le vieillissement reste un avertissement : un SDK en retard se voit venir, il ne bloque rien.
    # Une CLI antérieure aux contrôles (`--no-gates` inconnu) ne fait que les avertissements : on
    # le dit, sans échouer.
    - if: inputs.check == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GATES: ${{ inputs.gates }}
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        # Lu d'abord, puis cherché : `grep -q` dans un tube sous `pipefail` peut faire mentir le test.
        help="$(portaki ci check --help 2>/dev/null || true)"
        if [[ "$help" != *--no-gates* ]]; then
          if [ "$GATES" = "true" ]; then
            echo "::notice::portaki ${VERSION} predates the checks of \`ci check\` (release notes, permission reasons, entity columns, SDK pin) — warnings only. Raise the portaki-sdk this checkout resolves to."
          fi
          portaki ci check
        elif [ "$GATES" = "true" ]; then
          portaki ci check
        else
          portaki ci check --no-gates
        fi

    # `upload-artifact` enracine les deux chemins à leur ancêtre commun, `target/` : le job de
    # publication le télécharge au même endroit.
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: |
          ${{ inputs.working-directory }}/target/wasm32-unknown-unknown/release/*.wasm
          ${{ inputs.working-directory }}/target/portaki/
        if-no-files-found: error
        retention-days: 1
