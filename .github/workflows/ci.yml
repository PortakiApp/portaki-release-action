name: ci

on:
  push:
    branches: [main]
permissions:
  contents: read

# Un run chasse l'autre : la poussée la plus récente annule celles qui tournent encore sur la
# même branche ou la même PR, plutôt que de tourner en parallèle ou d'attendre leur fin.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Une action cassée ne se découvre autrement que dans le run de quelqu'un d'autre.
      - name: Lint the workflows and the examples
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml examples/*.yml"

      # `actionlint` ne lit pas les `action.yml`. Ce contrôle attrape la faute qui casse tout :
      # une étape composite qui n'a ni `uses` ni `shell`. Analysé en YAML et non au `grep` — une
      # première version comptait les lignes et ratait les étapes dont la clé tient sur la
      # ligne du tiret.
      - name: Check every composite step is runnable
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          status = 0
          for path in sorted(glob.glob("action.yml") + glob.glob("*/action.yml")):
              with open(path) as handle:
                  manifest = yaml.safe_load(handle)
              runs = manifest.get("runs", {})
              if runs.get("using") != "composite":
                  continue
              for index, step in enumerate(runs.get("steps", []), start=1):
                  name = step.get("name") or step.get("id") or f"step {index}"
                  if "uses" in step:
                      continue
                  if "run" not in step:
                      print(f"::error file={path}::{name} has neither `uses` nor `run`")
                      status = 1
                  elif "shell" not in step:
                      print(f"::error file={path}::{name} runs without declaring `shell`")
                      status = 1
              print(f"{path}: {len(runs.get('steps', []))} steps checked")
          sys.exit(status)
          PY

  # La jauge que le ruleset exige, et le seul check requis sur `main`.
  #
  # Un job de synthèse plutôt que d'exiger `actionlint` par son nom : le job s'appelle `lint` et
  # son check s'appelle `actionlint`, et cet écart est exactement le genre de détail qui fait
  # exiger un check qui n'existe pas. La jauge, elle, porte le même nom que dans les cinq autres
  # dépôts — la règle de branche est alors la même partout.
  #
  # `if: always()` pour qu'elle s'exécute même quand le lint échoue : sinon elle resterait « en
  # attente » et la PR ne dirait pas pourquoi elle est bloquée.
  quality:
    name: quality
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Quality gate
        env:
          LINT: ${{ needs.lint.result }}
        run: |
          if [ "$LINT" != "success" ]; then
            echo "::error::actionlint a fini en '$LINT'"
            exit 1
          fi
          echo "Contrôles verts."
