name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Une action cassée ne se découvre autrement que dans le run de quelqu'un d'autre.
      - name: Lint the workflows and the examples
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml examples/*.yml"

      # `actionlint` ne lit pas les `action.yml` : ce contrôle attrape la faute qui casse tout,
      # une étape composite sans `shell`.
      - name: Check every composite step declares its shell
        run: |
          set -euo pipefail
          status=0
          for manifest in action.yml */action.yml; do
            [ -f "$manifest" ] || continue
            runs=$(grep -c '^    - ' "$manifest" || true)
            shells=$(grep -c '^      shell: ' "$manifest" || true)
            uses=$(grep -c '^      uses: ' "$manifest" || true)
            if [ "$runs" -ne $((shells + uses)) ]; then
              echo "::error file=$manifest::$runs steps, $shells with a shell and $uses with uses"
              status=1
            fi
          done
          exit $status
