name: Portaki release
description: Push, sign and announce one Portaki module that the build action built — running none of its code.
author: Syntax Labs

# Le second des deux jobs, celui qui détient les droits de publication (`id-token: write`) : il
# n'exécute rien du module, pas même cargo. Il lit les sources (Cargo.lock, CHANGELOG,
# listing.json), télécharge ce que `PortakiApp/portaki-release-action/build@v2` a construit et
# testé sans droits, puis `portaki ci release` :
#
#   1. vérifie que l'artefact porte l'id, la version et le SDK des sources et du lock ;
#   2. demande au registre Portaki un droit de push court, limité à ce module et cette version,
#      et pousse l'artefact dans le dépôt OCI de Portaki (l'hôte vient de la réponse) ;
#   3. l'atteste sans clé avec l'identité de ce job : provenance SLSA v1 et rapport `cargo audit`,
#      produit ici, depuis Cargo.lock — jamais repris du job de build, que le module contrôle ;
#   4. annonce `oci://<hôte>/modules/<id>@<digest>` au registre, puis envoie listing.json.
#
# Un module, celui du répertoire qu'on lui donne. Un dépôt qui en porte plusieurs construit sa
# propre matrice : `portaki ci modules` répond « lesquels ».

branding:
  icon: package
  color: green

inputs:
  working-directory:
    description: The module to release — its crate root.
    default: "."
  artifact:
    description: Name of the artifact the build action uploaded.
    default: portaki-module
  channel:
    description: Registry channel the publication is announced on.
    default: stable
  api-url:
    description: Portaki platform to publish to. Empty means production.
    default: ""
  cli-version:
    description: >-
      Portaki CLI to install, or `auto` to match the SDK this checkout resolves to. Prebuilt only:
      this job runs no cargo.
    default: auto
  audit-fail-on:
    description: >-
      Lowest `cargo audit` severity that fails the release — `critical`, `high`, `medium`, `low`,
      or `none`. Informational advisories (unmaintained, unsound, yanked) only warn. The report
      is attested with the artifact either way.
    default: critical
  dry-run:
    description: Check the downloaded artifact against the sources, without pushing or announcing anything.
    default: "false"
  summary:
    description: Append what happened to the run summary.
    default: "true"
  report:
    description: >-
      Tell Portaki how the run ended, so a broken module raises an alert and a fixed one clears
      it. Nothing is stored on your side.
    default: "true"

outputs:
  id:
    description: The module id that was released.
    value: ${{ steps.release.outputs.id }}
  version:
    description: The version that was released.
    value: ${{ steps.release.outputs.version }}
  outcome:
    description: "`published`, `draft`, `already-published`, `dry-run`, or `failed`."
    value: ${{ steps.release.outputs.outcome }}
  digest:
    description: The digest that was pushed, signed and announced — empty when nothing was pushed.
    value: ${{ steps.release.outputs.digest }}
  reference:
    description: "`oci://<host>/modules/<id>@<digest>`, as announced."
    value: ${{ steps.release.outputs.reference }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED: ${{ inputs.cli-version }}
      run: bash "$GITHUB_ACTION_PATH/install/resolve.sh"

    # Le binaire précompilé de la release du SDK, somme vérifiée — jamais `cargo install`, jamais
    # de cache : un `rust-toolchain.toml` ou un `.cargo/config.toml` du module détournerait cargo.
    - shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        REQUIRED: "true"
      run: bash "$GITHUB_ACTION_PATH/install/prebuilt.sh"

    - shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        if ! portaki ci release --help >/dev/null 2>&1; then
          echo "::error::portaki ${VERSION} has no \`ci release\`, which this action needs — raise the portaki-sdk this checkout resolves to, or pin a newer \`cli-version\`."
          exit 1
        fi

    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.working-directory }}/target

    # Ici et non dans le job de build : le rapport attesté ne passe jamais entre les mains du
    # code du module. `cargo audit` lit Cargo.lock, il ne compile rien.
    - id: audit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FAIL_ON: ${{ inputs.audit-fail-on }}
        REPORT: ${{ runner.temp }}/portaki-cargo-audit.json
      run: bash "$GITHUB_ACTION_PATH/audit/audit.sh"

    # cosign v3.1.3 — le format que le registre vérifie.
    - if: inputs.dry-run != 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3

    - id: release
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PORTAKI_API_URL: ${{ inputs.api-url }}
        CHANNEL: ${{ inputs.channel }}
        DRY_RUN: ${{ inputs.dry-run }}
        AUDIT: ${{ steps.audit.outputs.report }}
      run: |
        set -euo pipefail
        if [ "$DRY_RUN" = "true" ]; then
          portaki ci release --dry-run --channel "$CHANNEL"
        else
          portaki ci release --channel "$CHANNEL" --audit "$AUDIT"
        fi

    # `always()` et non `failure()` : conditionné à l'échec, ce rapport ne pourrait jamais
    # ÉTEINDRE une alerte, et un module réparé garderait la sienne indéfiniment.
    - if: always() && inputs.report == 'true' && inputs.dry-run != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PORTAKI_API_URL: ${{ inputs.api-url }}
      run: portaki ci report --outcome "${{ job.status }}"

    - if: always() && inputs.summary == 'true'
      shell: bash
      env:
        ID: ${{ steps.release.outputs.id }}
        VERSION: ${{ steps.release.outputs.version }}
        OUTCOME: ${{ steps.release.outputs.outcome }}
        CHANNEL: ${{ inputs.channel }}
      # `always()`, et une seule en-tête de tableau : dans une matrice, chaque job ajoute sa
      # ligne au même résumé. Un résumé qui ne s'écrit qu'en cas de succès laisse justement sans
      # trace les runs qu'on relit.
      run: |
        set -euo pipefail
        if ! grep -q '^| module | version |' "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
          {
            echo "## Portaki release"
            echo
            echo "| module | version | channel | outcome |"
            echo "|---|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
        fi
        echo "| ${ID:-?} | ${VERSION:-—} | ${CHANNEL} | ${OUTCOME:-failed} |" >>"$GITHUB_STEP_SUMMARY"
